<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E5A5E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17231F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShivaKripa">
<title>ShivaKripa Mart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400..700&family=Baloo+Chettan+2:wght@500..800&display=swap" rel="stylesheet">
<style id="shell-css">
/* The look of this starter page only. It is taken away the moment the app's own screens start. */
:root{--paper:#F2F6F1;--surface:#FFFFFF;--sunk:#E6EEE8;--ink:#13231F;--muted:#55675F;--line:#D2DDD5;--teal:#0E5A5E;--teal-ink:#FFFFFF;--gold:#9A6F06;--warn-soft:#FBEBD0;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0F1917;--surface:#17231F;--sunk:#1F2E2A;--ink:#E8F0EC;--muted:#9DB0A8;--line:#2C3E39;--teal:#5CC2BC;--teal-ink:#06201F;--gold:#E3BC55;--warn-soft:#3B2C10;--bad:#F28B82;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1917;--surface:#17231F;--sunk:#1F2E2A;--ink:#E8F0EC;--muted:#9DB0A8;--line:#2C3E39;--teal:#5CC2BC;--teal-ink:#06201F;--gold:#E3BC55;--warn-soft:#3B2C10;--bad:#F28B82;color-scheme:dark}
html{font-size:115%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Anek Malayalam',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#shell{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;box-sizing:border-box}
#shell *{box-sizing:border-box}
#shell .card{width:100%;max-width:25rem;display:flex;flex-direction:column;gap:1rem;margin:auto}
#shell .name{font-family:'Baloo Chettan 2','Anek Malayalam',system-ui,sans-serif;font-weight:800;font-size:2.4rem;line-height:1;color:var(--teal)}
#shell .border{height:.375rem;border-radius:3px;background:linear-gradient(90deg,var(--gold) 0 62%,transparent 62% 66%,var(--gold) 66% 72%,transparent 72% 76%,var(--gold) 76% 79%,transparent 79%)}
#shell h2{margin:0;font-family:'Baloo Chettan 2','Anek Malayalam',system-ui,sans-serif;font-size:1.25rem;font-weight:600;line-height:1.15}
#shell p{margin:0}
#shell .muted{color:var(--muted)}
#shell .small{font-size:.875rem}
#shell label{display:flex;flex-direction:column;gap:.25rem;font-size:.875rem;color:var(--muted)}
#shell input{width:100%;min-height:2.75rem;padding:.5rem .625rem;border-radius:.375rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1rem}
#shell input:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
#shell button{display:inline-flex;align-items:center;justify-content:center;min-height:3.25rem;width:100%;padding:.5rem 1rem;border-radius:.625rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:1.1rem;cursor:pointer}
#shell button.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
#shell button[disabled]{opacity:.6;cursor:default}
#shell .msg{color:var(--bad);font-weight:600}
#shell .msg:empty{display:none}
#shell .note{border-radius:.625rem;padding:.625rem .875rem;background:var(--warn-soft);font-size:1rem}
#shell .note ol{margin:.375rem 0 .5rem;padding-left:1.375rem}
#shell .note li{margin:.25rem 0}
#shell .note .said{margin-top:.5rem;color:var(--muted);overflow-wrap:anywhere}
#shell .wait{display:flex;flex-direction:column;gap:.75rem;color:var(--muted);font-weight:600}
#shell .bar{position:relative;height:.75rem;border-radius:.375rem;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
#shell .bar i{position:absolute;top:0;bottom:0;left:-45%;width:45%;border-radius:.375rem;background:var(--teal);animation:shellslide 1.15s ease-in-out infinite}
@keyframes shellslide{from{left:-45%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#shell .bar i{animation:none;left:0;width:100%;opacity:.55}}
</style>
</head>
<body>
<div id="shell"><div class="card"><div><div class="name">ShivaKripa Mart</div></div><div class="border"></div><div class="wait" role="status"><span>Opening the shop…</span><div class="bar"><i></i></div></div></div></div>
<script>
/* ShivaKripa Mart: the starter page.

   This page stays the same; there is nothing here to change when the app changes.
   The screens of the app live in the shop's Google Apps Script project (the file Index.html there). This page
   fetches them through the shop link, keeps a copy on the device so the app opens quickly, starts them, and
   looks for a newer copy each time the app is opened. So the shop owner updates Apps Script only.

   No shop data and no shop link is kept in this file. The link is saved on each device when it is connected. */
(function () {
  'use strict';
  var LINK = 'skm_api', SCREENS = 'skm_screens', VER = 'skm_screens_v', OLD = 'skm_screens_old', OLDV = 'skm_screens_old_v', BAD = 'skm_screens_bad';
  var KEEP = { skm_size: 1, skm_theme: 1 };
  var d = document, w = window, running = false, touched = false, lastAsk = 0, asking = null;

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cleanLink(v) { var m = /https:\/\/script\.google\.com\/(?:a\/[^\/\s]+\/)?macros\/s\/[A-Za-z0-9_\-]+\/exec/.exec(String(v || '')); return m ? m[0] : ''; }
  /* Forget the shop on this device (link, sign-in, saved screens, a bill in progress). How the person likes the app to look stays. */
  function wipe() {
    try {
      var keys = [], i;
      for (i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('skm_') === 0 && !KEEP[k]) keys.push(k); }
      for (i = 0; i < keys.length; i++) localStorage.removeItem(keys[i]);
    } catch (e) {}
  }
  function fail(kind, text) { var e = new Error(text || kind); e.kind = kind; return e; }

  /* ---------- talking to the shop link ---------- */
  /* Asks the shop for the screens. "have" is the stamp of the copy already on this device; when that copy is
     still the current one the shop answers "same" and sends nothing else. */
  function ask(link, have) {
    var body = JSON.stringify({ name: 'screens', token: '', payload: { have: have || '', shell: 1 } });
    return fetch(link, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (res) { if (!res.ok) throw fail('net'); return res.text(); }, function () { throw fail('net'); })
      .then(function (text) {
        var r; try { r = JSON.parse(text); } catch (e) { throw fail('net'); }
        if (!r || !r.ok || !r.data) throw fail('old', r && r.error);
        return r.data;
      });
  }
  function good(html) { return typeof html === 'string' && html.length > 2000 && html.indexOf('<script') >= 0; }
  /* Keeps a copy of the screens on the device. The copy it replaces is kept once more, as the one to go back to. */
  function keep(r) {
    if (!r || !good(r.html)) return false;
    var v = String(r.version || ''), cur = get(SCREENS), curV = get(VER);
    if (good(cur) && curV && curV !== v) { if (!put(OLD, cur) || !put(OLDV, curV)) { put(OLD, null); put(OLDV, null); } }
    if (!put(SCREENS, r.html)) {
      put(OLD, null); put(OLDV, null);                       /* no room for two copies: keep only the new one */
      if (!put(SCREENS, r.html)) { put(SCREENS, null); put(VER, null); return false; }
    }
    return put(VER, v);
  }
  /* Looks for newer screens. Gives true when a newer copy was fetched and saved.
     A copy that would not start on this device is remembered and not fetched again; the next different one is. */
  function look() {
    var link = cleanLink(get(LINK)), mine = get(VER) || '', bad = get(BAD) || '';
    if (!link) return Promise.resolve(false);
    if (asking) return asking;
    lastAsk = Date.now();
    asking = ask(link, bad || mine).then(function (r) {
      asking = null;
      if (r.same) return false;
      if (r.version === mine) { put(BAD, null); return false; }
      if (!keep(r)) return false;
      put(BAD, null);
      return true;
    }, function () { asking = null; return false; });
    return asking;
  }
  /* After a look in the background: the running screens decide when to switch (they know whether a bill is half done).
     Screens that do not say are replaced at once, but only while nobody has touched the app yet. */
  function lookAndTell() {
    look().then(function (fresh) {
      if (!fresh) return;
      /* never go round in circles: newer screens three times within two minutes is not a person deploying, so wait for the next opening */
      var now = Date.now(), times = [];
      try { times = JSON.parse(sessionStorage.getItem('skm_fresh') || '[]'); } catch (e) {}
      if (!times || !times.filter) times = [];
      times = times.filter(function (t) { return now - t < 120000; }); times.push(now);
      try { sessionStorage.setItem('skm_fresh', JSON.stringify(times)); } catch (e1) {}
      if (times.length > 3) return;
      if (typeof w.SKM_ON_UPDATE === 'function') { try { w.SKM_ON_UPDATE(); return; } catch (e2) {} }
      if (!touched) location.reload();
    });
  }

  /* ---------- starting the screens ---------- */
  function each(list, fn) { for (var i = 0; i < list.length; i++) fn(list[i]); }
  function run(html) {
    if (running) return; running = true;
    var doc = new DOMParser().parseFromString(html, 'text/html'), scripts = [];
    each(doc.querySelectorAll('script'), function (s) { scripts.push(s); });
    each(scripts, function (s) { if (s.parentNode) s.parentNode.removeChild(s); });
    var old = d.getElementById('shell-css'); if (old) old.parentNode.removeChild(old);
    if (doc.title) d.title = doc.title;
    /* what the screens say about <html> and <body> (language, classes) is taken over; this page's own install details stay */
    each(doc.documentElement.attributes, function (a) { d.documentElement.setAttribute(a.name, a.value); });
    each(doc.body.attributes, function (a) { d.body.setAttribute(a.name, a.value); });
    each(doc.querySelectorAll('link[href]'), function (l) {
      var href = l.getAttribute('href'), have = /manifest|icon/i.test(l.getAttribute('rel') || '');
      each(d.querySelectorAll('link[href]'), function (x) { if (x.getAttribute('href') === href) have = true; });
      if (!have) d.head.appendChild(d.importNode(l, true));
    });
    each(doc.querySelectorAll('style'), function (s) { var n = d.createElement('style'); n.textContent = s.textContent; d.head.appendChild(n); });
    while (d.body.firstChild) d.body.removeChild(d.body.firstChild);
    while (doc.body.firstChild) d.body.appendChild(d.adoptNode(doc.body.firstChild));
    /* the scripts run in the order they stand in the page, the ones in the head first */
    each(scripts, function (s) {
      var n = d.createElement('script');
      each(s.attributes, function (a) { n.setAttribute(a.name, a.value); });
      if (s.getAttribute('src')) n.async = false; else n.text = s.textContent;
      d.body.appendChild(n);
    });
    setTimeout(rescue, 3000);
  }
  /* The screens say "alive" once they have started (window.SKM_ALIVE). If a newer copy does not start, the device goes
     back to the copy that worked and leaves the bad one alone. With no earlier copy, the screens are fetched again
     without asking, once; if the app still does not start, a bar says so. */
  function rescue() {
    var tried = true, cur = get(VER) || '', old = get(OLD), oldV = get(OLDV) || '';
    if (w.SKM_ALIVE) { try { sessionStorage.removeItem('skm_rescued'); } catch (e) {} return; }
    if (d.getElementById('skm-rescue')) return;
    if (good(old) && oldV && oldV !== cur && put(SCREENS, old)) {
      put(VER, oldV); put(BAD, cur); put(OLD, null); put(OLDV, null);
      location.reload(); return;
    }
    try { tried = sessionStorage.getItem('skm_rescued') === '1'; sessionStorage.setItem('skm_rescued', '1'); } catch (e2) {}
    if (!tried) { put(SCREENS, null); put(VER, null); location.reload(); return; }
    var bar = d.createElement('div'); bar.id = 'skm-rescue';
    bar.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;background:#B3261E;color:#fff;font:600 16px system-ui,sans-serif');
    bar.innerHTML = '<span style="flex:1;min-width:180px">The app did not start properly.</span><button type="button" style="min-height:44px;padding:8px 16px;border:0;border-radius:10px;background:#fff;color:#13231F;font:600 16px system-ui,sans-serif">Load it again</button>';
    bar.querySelector('button').onclick = function () { put(SCREENS, null); put(VER, null); put(BAD, null); location.reload(); };
    d.body.appendChild(bar);
  }

  /* ---------- this page's own few screens ---------- */
  function shell() {
    var el = d.getElementById('shell');
    if (!el) { el = d.createElement('div'); el.id = 'shell'; while (d.body.firstChild) d.body.removeChild(d.body.firstChild); d.body.appendChild(el); }
    return el;
  }
  function head() { return '<div><div class="name">' + esc(get('skm_shop') || 'ShivaKripa Mart') + '</div></div><div class="border"></div>'; }
  function loader() { shell().innerHTML = '<div class="card">' + head() + '<div class="wait" role="status"><span>Opening the shop…</span><div class="bar"><i></i></div></div></div>'; }
  var STEPS = '<ol><li><b>Deploy</b>, then <b>Manage deployments</b>.</li><li>The pencil, then <b>Who has access: Anyone</b>.</li><li><b>Version: New version</b>, then <b>Deploy</b>.</li></ol>';
  /* Why did the shop link not hand over the screens? Gives the words to show. */
  function why(link, e) {
    if (e && e.kind === 'old') {
      var said = e.message && e.message !== 'old' ? '<p class="small said">The shop\'s script said: ' + esc(e.message) + '</p>' : '';
      return Promise.resolve('<div class="note linkhelp"><b>The shop link answered, but it could not hand over the screens.</b> Its script is probably older than this app.<br><br>' +
        'The shop owner pastes the newest <b>Code.gs</b> and <b>Index.html</b> into Apps Script, then:' + STEPS + 'The link stays the same. Then try again here.' + said + '</div>');
    }
    return fetch(link, { mode: 'no-cors', cache: 'no-store' }).then(function () {
      return '<div class="note linkhelp"><b>Google answered, but the app is not allowed to read the answer.</b> The usual reason: the shop link only works for someone who is signed in to Google. ' +
        'The app cannot sign in, so the link has to be open to anyone who has it.<br><br>The shop owner does this once, in Apps Script:' + STEPS +
        'The link stays the same. Then try again here. If it still fails, check that the whole link was copied.</div>';
    }, function () { return ''; });
  }
  function connect(link, e) {
    shell().innerHTML = '<form class="card" data-form="connect" novalidate>' + head() +
      '<h2>Connect this device to the shop</h2><p class="muted">Paste the shop link below. This is needed only once on each phone, tablet or computer. The shop owner has the link.</p>' +
      '<label>Shop link<input id="c-link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(link || '') + '"></label>' +
      '<button class="primary" type="submit">Connect</button><div class="msg" id="c-msg" role="alert"></div><div id="c-help"></div></form>';
    var form = shell().querySelector('form'), btn = form.querySelector('button'), msg = d.getElementById('c-msg'), help = d.getElementById('c-help');
    var showWhy = function (l, err) {
      btn.disabled = false; btn.textContent = 'Connect';
      why(l, err).then(function (h) { if (h) { help.innerHTML = h; if (help.scrollIntoView) help.scrollIntoView({ block: 'nearest' }); } else msg.textContent = 'No answer from the shop. Check the internet and try again.'; });
    };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      if (btn.disabled) return;
      var l = cleanLink(d.getElementById('c-link').value);
      msg.textContent = ''; help.innerHTML = '';
      if (!l) { msg.textContent = 'That is not the shop link. It starts with https://script.google.com/macros/s/ and ends with /exec'; return; }
      btn.disabled = true; btn.textContent = 'Connecting…';
      join(l, function (err) { showWhy(l, err); });
    };
    if (e && link) showWhy(link, e);
  }
  /* Connect to a shop link: it counts only once the shop has handed over the screens. */
  function join(link, failed) {
    ask(link, '').then(function (r) {
      if (!good(r.html)) throw fail('old');
      wipe(); put(LINK, link); keep(r); run(r.html);
    }).then(null, failed);
  }
  function cannotOpen(link, e) {
    shell().innerHTML = '<div class="card">' + head() + '<h2>The app could not open</h2><p id="c-msg">Looking for the reason…</p>' +
      '<button class="primary" type="button" data-act="reload">Try again</button><button type="button" data-act="changeLink">Use a different shop link</button><div id="c-help"></div></div>';
    var b = shell().querySelectorAll('button');
    b[0].onclick = function () { loader(); open(); };
    b[1].onclick = function () { wipe(); connect(''); };
    why(link, e).then(function (h) {
      var m = d.getElementById('c-msg'), box = d.getElementById('c-help'); if (!m || !box) return;
      if (h) { m.textContent = 'The shop link did not hand over the app.'; box.innerHTML = h; } else m.textContent = 'No answer from the shop. Check the internet and try again.';
    });
  }
  function askSwitch(given) {
    shell().innerHTML = '<div class="card">' + head() + '<h2>This device is already connected to a shop</h2>' +
      '<p class="muted">The link you just opened is a different shop link. Switching signs this device out of the shop it uses now.</p>' +
      '<button class="primary" type="button" data-act="keepLink">Keep the shop it uses now</button><button type="button" data-act="switchLink">Switch to the new link</button></div>';
    var b = shell().querySelectorAll('button');
    b[0].onclick = function () { loader(); open(); };
    b[1].onclick = function () { loader(); join(given, function (e) { connect(given, e); }); };
  }

  /* ---------- opening ---------- */
  function open() {
    var link = cleanLink(get(LINK)), html = get(SCREENS);
    if (!link) return connect('');
    if (good(html) && get(VER)) { run(html); lookAndTell(); return; }
    ask(link, '').then(function (r) { if (!good(r.html)) throw fail('old'); keep(r); run(r.html); }).then(null, function (e) { cannotOpen(link, e); });
  }
  /* A set-up link ends in  #shop=<the shop link>. Opening it once connects the device. */
  function linkFromAddress() {
    var m = /[#&]shop=([^&]+)/.exec(location.hash || ''), link = '';
    if (!m) return '';
    try { link = cleanLink(decodeURIComponent(m[1])); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e2) {}
    return link;
  }

  w.SKM_PWA = true;   /* tells the screens they run as the installed app and reach the sheet through the shop link */
  w.SKM_SHELL = {
    v: 1,
    version: function () { return get(VER) || ''; },
    check: function () { return look(); },                                           /* Promise<true> when newer screens were fetched and saved */
    fresh: function () { put(SCREENS, null); put(VER, null); put(BAD, null); location.reload(); },   /* drop the kept copy and fetch the screens again */
    forget: function () { wipe(); location.reload(); }                              /* disconnect this device */
  };
  /* The offer to install can arrive before the screens are there: keep it for them. */
  w.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); w.SKM_INSTALL = e; if (typeof w.SKM_ON_INSTALL === 'function') w.SKM_ON_INSTALL(e); });
  if ('serviceWorker' in navigator) w.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  each(['pointerdown', 'keydown', 'touchstart'], function (ev) { d.addEventListener(ev, function () { touched = true; }, true); });
  /* A set-up link opened while the app is already open only changes the end of the address: start again to take it. */
  w.addEventListener('hashchange', function () { if (/[#&]shop=/.test(location.hash || '')) location.reload(); });
  /* An installed app is rarely closed, only put aside: look again when it comes back after a while. */
  d.addEventListener('visibilitychange', function () { if (!d.hidden && running && Date.now() - lastAsk > 10 * 60 * 1000) lookAndTell(); });

  var th = get('skm_theme'); if (th === 'dark' || th === 'light') d.documentElement.setAttribute('data-theme', th);
  if (!w.fetch || !w.Promise || !w.DOMParser) {
    shell().innerHTML = '<div class="card">' + head() + '<h2>This browser is too old for the installed app</h2><p class="muted">Open the shop link itself in Chrome instead, or update Chrome from the Play Store and try again.</p></div>';
    return;
  }
  var given = linkFromAddress(), saved = cleanLink(get(LINK));
  if (given && saved && given !== saved) askSwitch(given);
  else if (given && !saved) join(given, function (e) { connect(given, e); });
  else open();
})();
</script>
</body>
</html>
