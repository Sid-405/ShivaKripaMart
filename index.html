<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E5A5E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17231F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShivaKripa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ShivaKripa Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400..700&family=Baloo+Chettan+2:wght@500..800&display=swap" rel="stylesheet">
<style>
/* Layout: phone first, one column with a bottom bar. From 900px a left rail and a two-pane selling screen.
   The bill is the one paper-like object (ruled like the shop's bill book); everything else stays quiet. */
:root{
  --paper:#F2F6F1; --surface:#FFFFFF; --sunk:#E6EEE8; --ink:#13231F; --muted:#55675F; --line:#D2DDD5;
  --teal:#0E5A5E; --teal-ink:#FFFFFF; --teal-soft:#DAEAE8; --gold:#9A6F06; --gold-soft:#F6ECCB;
  --good:#1D7A48; --good-soft:#DDF0E4; --warn:#9A5600; --warn-soft:#FBEBD0; --bad:#B3261E; --bad-soft:#F9E1DE;
  --slip:#FCFDF7; --rule:#CFDCE8; --margin:#E8B1AA; --shade:rgba(19,35,31,.45);
  --display:'Baloo Chettan 2','Anek Malayalam',system-ui,sans-serif;
  --body:'Anek Malayalam',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; --r-sm:6px; --lift:0 1px 2px rgba(19,35,31,.08),0 8px 24px rgba(19,35,31,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1917; --surface:#17231F; --sunk:#1F2E2A; --ink:#E8F0EC; --muted:#9DB0A8; --line:#2C3E39;
  --teal:#5CC2BC; --teal-ink:#06201F; --teal-soft:#1D3A38; --gold:#E3BC55; --gold-soft:#3A3115;
  --good:#6FCF97; --good-soft:#173527; --warn:#F0B354; --warn-soft:#3B2C10; --bad:#F28B82; --bad-soft:#40201D;
  --slip:#1B2824; --rule:#2B4150; --margin:#6B3A36; --shade:rgba(0,0,0,.6);
  --lift:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F1917; --surface:#17231F; --sunk:#1F2E2A; --ink:#E8F0EC; --muted:#9DB0A8; --line:#2C3E39;
  --teal:#5CC2BC; --teal-ink:#06201F; --teal-soft:#1D3A38; --gold:#E3BC55; --gold-soft:#3A3115;
  --good:#6FCF97; --good-soft:#173527; --warn:#F0B354; --warn-soft:#3B2C10; --bad:#F28B82; --bad-soft:#40201D;
  --slip:#1B2824; --rule:#2B4150; --margin:#6B3A36; --shade:rgba(0,0,0,.6);
  --lift:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3,.num{font-family:var(--display);line-height:1.15;text-wrap:balance}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .small{font-size:.875rem} .right{text-align:right} .nowrap{white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- frame ---------- */
body{display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.main{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:1.3rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .who{font-size:.875rem;color:var(--muted);white-space:nowrap}
.view{--vp:16px;flex:1;min-height:0;overflow-y:auto;padding-block:var(--vp) 28px;padding-inline:16px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.75rem;color:var(--muted);min-width:0}
.nav button[aria-current="page"]{color:var(--teal);font-weight:600}
.nav button.sellnav svg{background:var(--teal);color:var(--teal-ink);border-radius:50%;padding:7px;width:40px;height:40px;margin-top:-16px;box-shadow:var(--lift)}
.rail{display:none}
@media (min-width:900px){
  #app{flex-direction:row}
  .nav{display:none}
  .rail{display:flex;flex-direction:column;gap:2px;width:216px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
  .rail .brand{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.1;padding:4px 10px 2px;color:var(--teal)}
  .rail .place{font-size:.8rem;color:var(--muted);padding:0 10px 12px}
  .rail button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);text-align:left;color:var(--ink)}
  .rail button:hover{background:var(--sunk)}
  .rail button[aria-current="page"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
  .rail hr{border:0;border-top:1px solid var(--line);margin:8px 6px;width:auto}
  .rail .spacer{flex:1}
  .view{--vp:22px;padding-block:var(--vp) 36px;padding-inline:28px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.quiet{border-color:transparent;background:none;color:var(--teal)}
.btn.big{min-height:52px;font-size:1.1rem;width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.875rem}
.btn[disabled]{opacity:.55;cursor:default}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);border-top-color:transparent;animation:spin .7s linear infinite}
.btn.primary.busy::after{border-color:var(--teal-ink);border-top-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{border:0;background:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted);min-width:0}
label.f>span.hint{font-size:.8rem}
input.in,select.in,textarea.in{width:100%;min-height:44px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem}
textarea.in{min-height:72px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
input.in.num,input.amt{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.search{position:relative}
.pick>.search{position:sticky;top:calc(8px - var(--vp));z-index:6;box-shadow:0 0 0 8px var(--paper)}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.search input{padding-left:42px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.gold{background:var(--gold-soft);color:var(--gold)}
.check{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-size:.9rem;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);min-width:44px;min-height:44px;padding:0 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);flex:none}
.step button{border:0;background:none;width:40px;height:42px;font-size:1.3rem;line-height:1;color:var(--teal)}
.step input{width:44px;border:0;background:none;text-align:center;font-family:var(--display);font-weight:600;font-size:1.05rem;-moz-appearance:textfield;padding:0}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel>h3{margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;min-height:56px;color:var(--ink)}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--sunk)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.item .amt{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--sunk);font-size:.95rem}
.note.fest{background:var(--gold-soft);border:1px solid var(--gold)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.note button{margin-left:auto;flex:none}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th{font-weight:600;color:var(--muted);text-align:left;font-size:.82rem;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.kv .n{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.kv .total{border-top:2px solid var(--ink);padding-top:6px;font-weight:700}

/* ---------- home ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stats>*{padding:10px 12px;border:0;border-left:1px solid var(--line);min-width:0;background:none;text-align:left;color:var(--ink)}
.stats>*:first-child{border-left:0}
.stats .v{font-family:var(--display);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .k{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.meter{height:6px;border-radius:3px;background:var(--sunk);margin-top:4px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--teal)}

/* ---------- sell ---------- */
.sell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
/* wide screens: the item list and the bill scroll on their own, and the bill's main button stays put under it */
@media (min-width:900px){
  .view.fit{overflow:hidden;padding-bottom:var(--vp)}
  .view.fit>.wrap{height:100%;max-width:1200px}
  .sell{grid-template-columns:minmax(0,1fr) minmax(360px,440px);grid-template-rows:minmax(0,1fr);flex:1;min-height:0;align-items:stretch;gap:24px}
  .sell>.pick{overflow-y:auto;min-height:0;padding:0 12px 16px 2px;margin-right:-12px}
  .sell>.pick>*,.sell #sellbody>*,.colbody>*{flex-shrink:0}
  .sell>.pick>.search{top:0}
  .sell .slipcol{display:flex;flex-direction:column;min-height:0}
  .colbody{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 18px;margin:0 -12px}
  .colfoot{flex:none;padding-top:12px}
  .sell>.pick .btn.quiet[data-act="oneOff"]{display:none}   /* the bill beside it already has this button */
}
@media (max-width:899px){.sell .slipcol{display:none}}
.pick .item .stockno{font-size:.8rem}
.billbar{position:sticky;bottom:-28px;margin:0 -16px -28px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(19,35,31,.08)}
/* the next thing to do on the bill: one big button that sits under the screen, always in the same place */
.dock{flex:none;position:relative;z-index:2;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(19,35,31,.08);animation:up .18s ease-out}
.dock>*{max-width:640px;margin-inline:auto}
@media (min-width:900px){.dock{display:none!important}}
.slip{background:var(--slip);border:1px solid var(--line);border-radius:4px 4px 0 0;position:relative;padding:14px 14px 18px 26px;
  background-image:linear-gradient(90deg,transparent 15px,var(--margin) 15px,var(--margin) 16px,transparent 16px);box-shadow:var(--lift)}
.slip::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;
  background:linear-gradient(135deg,var(--slip) 6px,transparent 0) 0 0/12px 9px repeat-x,linear-gradient(225deg,var(--slip) 6px,transparent 0) 0 0/12px 9px repeat-x}
.slip .shop{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.1}
.slip .line{padding:10px 0;border-bottom:1px solid var(--rule)}
.slip .line .nm{font-weight:600;overflow-wrap:anywhere}
.slip .line .lhead{align-items:flex-start}
.slip .line .nm{font-size:1.05rem}
.slip .ltot{flex:none;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.15rem;white-space:nowrap}
.slip .line .ctl{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.slip .ctl .step button{width:46px;height:46px;font-size:1.5rem}
.slip .ctl .step input{width:46px;font-size:1.15rem}
.slip .price{max-width:170px;min-height:48px;font-size:1.1rem}
.slip .line .lfoot{margin-top:6px}
.slip .check input{width:24px;height:24px}
.slipacts{display:grid;gap:8px;padding:12px 0 10px}
.slipacts .btn{justify-content:flex-start;min-height:46px}
.slip .sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.slip .grand{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 6px}
.slip .grand .num{font-size:2rem;font-weight:700;border-bottom:4px double var(--ink);padding-bottom:2px}
.warnline{font-size:.82rem;color:var(--warn);margin-top:4px}
.warnline.bad{color:var(--bad)}

.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1fr) minmax(380px,460px)} .two .side{order:2;position:sticky;top:0}}
/* ---------- sheets, toasts ---------- */
.shade{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--lift);animation:up .18s ease-out}
.sheet.wide{max-width:760px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet>header{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line)}
.sheet>header h2{flex:1;min-width:0}
.sheet>.body{padding:16px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.sheet>footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.sheet>footer .btn{flex:1}
@media (min-width:700px){.shade{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.toasts{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:18px;font-weight:600;box-shadow:var(--lift);max-width:100%;text-align:center;animation:up .18s ease-out}
.toast.bad{background:#B3261E;color:#fff}
.toast.hint{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold)}

/* ---------- new bill: three small steps on a phone (pick, check, pay); side by side on a wide screen ---------- */
.wrap.narrow{max-width:640px}
.ask{font-size:1.4rem;font-weight:700;line-height:1.2}
.sec{font-size:.95rem;font-weight:600;color:var(--muted);margin-top:2px}
.grp{font-size:1.35rem;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:78px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 1px 0 var(--line)}
.tile .t{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.15;overflow-wrap:anywhere}
.tile .s{font-size:.85rem;color:var(--muted)}
.tile:hover,.tile:focus-visible{border-color:var(--teal)}

    body(tableHtml([{ t: 'Date' }, { t: 'Item' }, { t: 'What happened' }, { t: 'Pieces', n: 1 }, { t: 'Value at cost', n: 1 }], r.rows.map(function (x) { return [esc(dLong(x.date)), esc(x.name), esc(x.reason) + '<br><span class="muted small">' + esc(x.by) + '</span>', (x.qty > 0 ? '+' : '') + x.qty, x.qty < 0 ? money(x.value) : '']; }), ['Lost in this period', '', '', '', money(tot)]) || '<div class="empty">Nothing broken or lost was recorded in this period.</div>');
  }).catch(fail);
  loadDash().then(function (dd) {
    var t = dd.tot, h = '';
    if (repTab === 'summary') {
      h = '<div class="panel"><div class="kv"><span>Sales (' + t.bills + ' bills, ' + t.units + ' items)</span><span class="n">' + money(t.sales) + '</span>' + (t.tax ? '<span>Tax collected</span><span class="n">−' + money(t.tax) + '</span>' : '') +
        '<span>Cost of the items sold</span><span class="n">−' + money(t.cogs) + '</span><span class="total">Profit on items</span><span class="n total">' + money(t.profit) + '</span>' +
        '<span>Travel and transport</span><span class="n">−' + money(t.travel) + '</span><span>Breakage and other losses</span><span class="n">−' + money(t.loss) + '</span><span class="total">Profit after these</span><span class="n total ' + (t.net < 0 ? 'bad' : 'good') + '">' + money(t.net) + '</span></div></div>' +
        '<div class="panel"><div class="kv"><span>Discounts given</span><span class="n">' + money(t.discount) + '</span><span>Earned from painting for customers</span><span class="n">' + money(t.paint) + '</span><span>Money received</span><span class="n">' + money(t.received) + '</span><span>Stock bought (deliveries)</span><span class="n">' + money(t.bought) + '</span></div></div>' +
        (tableHtml([{ t: 'Category' }, { t: 'Sold', n: 1 }, { t: 'Sales', n: 1 }, { t: 'Profit', n: 1 }], dd.cats.map(function (c) { return [esc(c.cat), c.qty, money(c.rev), money(c.profit)]; })) || '') +
        (tableHtml([{ t: 'Sold by' }, { t: 'Bills', n: 1 }, { t: 'Sales', n: 1 }], dd.sellers.map(function (c) { return [esc(c.name), c.bills, money(c.sales)]; })) || '');
    } else if (repTab === 'items') {
      var list = dd.items.slice(); if (repSort === 'least') list.sort(function (a, b) { return a.qty - b.qty; });
      h = chipRow('repSort', [['most', 'Best sellers first'], ['least', 'Slowest first']], repSort) + (tableHtml([{ t: 'Item' }, { t: 'Sold', n: 1 }, { t: 'Sales', n: 1 }, { t: 'Profit', n: 1 }], list.map(function (i) { return [esc(i.name) + '<br><span class="muted small">' + esc(i.cat) + '</span>', i.qty, money(i.rev), money(i.profit)]; }), ['Total', t.units, money(r2(t.sales - t.tax)), money(t.profit)]) || '<div class="empty">Nothing sold in this period.</div>');
    } else if (repTab === 'tobuy') {
      var buy = toBuyList(), est = 0; buy.forEach(function (b) { est += b.buy * (b.p.cost || 0); });
      h = '<p class="muted">Items that are low now, or will run out within ' + S.settings.ReorderPlanDays + ' days at the speed they sold in the last 30 days. Only counted items appear.</p>' +
        (tableHtml([{ t: 'Item' }, { t: 'In stock', n: 1 }, { t: 'Buy about', n: 1 }, { t: 'Why' }, { t: 'Last cost', n: 1 }, { t: 'Vendor' }], buy.map(function (b) { return [esc(fullName(b.p)), b.p.stock, b.buy, esc(b.why), money(b.p.cost), esc(b.p.vendor || '–')]; }), ['About', '', '', '', money(est), '']) || '<div class="empty">Nothing needs buying right now.</div>');
    } else {
      var lim = addDays(today(), -(S.settings.NonMovingDays || 90)), rows = S.products.filter(function (p) { return p.active && (p.stock === null || p.stock > 0) && (!dd.lastSold[p.sku] || dd.lastSold[p.sku] < lim); });
      rows.sort(function (a, b) { return (dd.lastSold[a.sku] || '') < (dd.lastSold[b.sku] || '') ? -1 : 1; });
      var young = !dd.firstSale || dd.firstSale > lim;
      h = '<p class="muted">Items in the shop that have not sold for ' + S.settings.NonMovingDays + ' days or more.</p>' + (young ? '<div class="note">' + ic('alert') + '<div>The app has less than ' + S.settings.NonMovingDays + ' days of sales so far, so this list is not reliable yet.</div></div>' : '') +
        (tableHtml([{ t: 'Item' }, { t: 'In stock', n: 1 }, { t: 'Last sold' }, { t: 'Value at cost', n: 1 }], rows.slice(0, 300).map(function (p) { return [esc(fullName(p)), p.stock === null ? 'Not counted' : p.stock, dd.lastSold[p.sku] ? esc(dLong(dd.lastSold[p.sku])) : 'Never in the app', p.stock ? money(p.stock * (p.avg || p.cost || 0)) : '']; })) || '<div class="empty">Every item has sold recently.</div>');
    }
    body(h);
  }).catch(fail);
};

var SET_GROUPS = [
  ['Shop', [['ShopName', 'Shop name'], ['LocationName', 'Place'], ['ShopPhone', 'Shop phone'], ['CurrencySymbol', 'Currency symbol'], ['Timezone', 'Time zone']]],
  ['Prices', [['MinMarkupPercent', 'Smallest markup on cost (%)', 'The app suggests cost + this % as the selling price and warns below it.'], ['PaintExtraPercent', 'Extra for painting for a customer (%)', 'Added to the price when "Painted for customer" is ticked on a bill.'], ['RoundPricesTo', 'Round suggested prices up to the next', 'In rupees. 5 turns 132 into 135.'], ['TaxName', 'Tax name'], ['TaxPercent', 'Tax on every bill (%)', 'Keep 0 while the shop does not charge GST.']]],
  ['Stock and reminders', [['DefaultReorderLevel', 'Low stock when this many or fewer are left', 'An item can have its own number.'], ['ReorderPlanDays', 'The "To buy" list looks ahead (days)'], ['NonMovingDays', 'Not moving after (days without a sale)'], ['FestivalAlertDays', 'Show a festival this many days before']]],

  return festDraft.map(function (f, i) { return '<tr><td><input class="in" type="date" id="f-d' + i + '" value="' + esc(f.date) + '" data-in="fest" data-i="' + i + '" data-k="date" aria-label="Date"></td><td><input class="in" id="f-n' + i + '" value="' + esc(f.name) + '" data-in="fest" data-i="' + i + '" data-k="name" aria-label="Festival" style="min-width:150px"></td><td><input class="in" id="f-s' + i + '" value="' + esc(f.notes) + '" data-in="fest" data-i="' + i + '" data-k="notes" aria-label="What to stock" style="min-width:200px"></td><td><button class="iconbtn" data-act="festDel" data-i="' + i + '" aria-label="Remove">' + ic('trash') + '</button></td></tr>'; }).join('');
}

      var k = f[0], c;
      if (k === 'StaffCanCancelBills') c = sel('set-' + k, ['Yes', 'No'], s[k]);
      else if (k === 'DefaultSoldBy') c = sel('set-' + k, [s.ShopName].concat(S.lists.Staff || []), s[k], '', 'The person who is signed in');
      else if (k === 'Timezone') c = sel('set-' + k, ['Asia/Kolkata', 'Asia/Dubai', 'Asia/Singapore', 'Europe/London', 'America/New_York'], s[k]);

    '<form class="panel stack" data-form="lists" novalidate><h3>Lists</h3><p class="muted small">One entry on each line. These fill the dropdowns in the app and in the sheet.</p><div class="grid2">' + LIST_LABELS.map(function (l) { return fld(l[1], '<textarea class="in" id="list-' + l[0] + '" rows="5">' + esc((S.lists[l[0]] || []).join('\n')) + '</textarea>'); }).join('') + '</div><div><button class="btn primary" type="submit">Save lists</button></div>' +
    '<h3 style="margin-top:6px">Rename on every item</h3><p class="muted small">Changes the name in the list and on all items that use it.</p><div class="grid3">' + fld('List', sel('rn-list', ['Category', 'Size', 'Material'], 'Category', 'data-in="rnList"')) + fld('Old name', '<span id="rn-oldbox">' + sel('rn-old', S.lists.Category || [], '') + '</span>') + fld('New name', inp('rn-new', '', 'autocomplete="off"')) + '</div><div><button class="btn" type="button" data-act="renameEverywhere">Rename</button></div></form>' +
    '<div class="panel stack"><h3>Festivals</h3><p class="muted small">Each one shows on the home screen ' + s.FestivalAlertDays + ' days before its date, with the note about what to stock. Dates change every year, so add next year\'s here.</p><div class="tablebox"><table class="t"><thead><tr><th>Date</th><th>Festival</th><th>What to stock</th><th></th></tr></thead><tbody id="festbody">' + festRows() + '</tbody></table></div>' +
